[workspace.package]
license = "MIT-0"
authors = ["Parity Technologies <admin@parity.io>"]
homepage = "https://paritytech.github.io/polkadot-sdk/"
repository = "https://github.com/paritytech/polkadot-sdk-minimal-template.git"
edition = "2021"

[workspace]
default-members = ["mock-runtime"]
members = [
    "node",
    "mock-runtime",
    "testing"
]
resolver = "2"

[workspace.dependencies]
log = { version = "0.4.27", default-features = false }
mock-runtime = { path = "./mock-runtime", default-features = false }
clap = { version = "4.5.13" }
docify = { version = "0.2.9" }
futures = { version = "0.3.31" }
futures-timer = { version = "3.0.2" }
jsonrpsee = { version = "0.24.3" }
polkadot-sdk = { version = "2503.0.1", default-features = false }
serde_json = { version = "1.0.132", default-features = false }
codec = { version = "3.7.4", default-features = false, package = "parity-scale-codec" }
scale-info = { version = "2.11.6", default-features = false }
getrandom = { version = "*", default-features = false, features = ["js"] }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
subxt = { version = "0.41.0" }
tokio = { version = "1.41.1" }